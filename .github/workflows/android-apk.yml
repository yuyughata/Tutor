# Builds an installable Android APK for testing (debug-keystore signed, not for the Play Store).
# Runs on every push that changes app/ on the development branch, or by hand: Actions > "Android APK" > Run workflow. The APK is attached to the run as the "genova-apk" artifact.
name: Android APK

on:
  workflow_dispatch:
  push:
    branches: [claude/gifted-brahmagupta-a0jtkt]
    paths: ['.github/workflows/android-apk.yml', 'app/**']

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: app
    env:
      # public values (the anon key is meant to be in the app); same as app/eas.json
      # the website address (for the "Change plan" link): set it under Settings > Secrets and variables > Actions > Variables
      EXPO_PUBLIC_WEB_URL: ${{ vars.EXPO_PUBLIC_WEB_URL }}
      EXPO_PUBLIC_SUPABASE_URL: https://cjdrlddvbyfataumdztg.supabase.co
      EXPO_PUBLIC_SUPABASE_ANON_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImNqZHJsZGR2YnlmYXRhdW1kenRnIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTE0NzA0MzcsImV4cCI6MjEwNzA0NjQzN30.SwnZqajinzmRx_6t2oWFlAAV-8v-u9URHImiB1DKhvA
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - run: npm ci
      - name: Generate the native Android project
        run: npx expo prebuild --platform android --no-install
        env:
          CI: '1'
      - name: Build the APK
        working-directory: app/android
        run: ./gradlew assembleRelease -PreactNativeArchitectures=arm64-v8a,armeabi-v7a --no-daemon
        env:
          GRADLE_OPTS: -Dorg.gradle.jvmargs=-Xmx4g
      - run: ls -la android/app/build/outputs/apk/release/
      - uses: actions/upload-artifact@v4
        with:
          name: genova-apk
          path: app/android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
