<div class="modal-overlay" id="catalogModal" data-modal-overlay>
  <div class="modal-panel" role="dialog" aria-modal="true" aria-labelledby="catalogTitle" tabindex="-1">
    <div class="modal-head">
      <div>
        <h3 id="catalogTitle">The Full Genova Title Catalog</h3>
        <p>900+ story topics across all 7 pillars, grouped by reading level, not age.</p>
      </div>
      <button type="button" class="modal-close" data-catalog-close aria-label="Close the catalog">✕</button>
    </div>
    <div class="modal-tabs" id="catalogTabs" role="group" aria-label="Reading level">
      <button type="button" class="modal-tab active" data-level="sunrise" aria-pressed="true">Genova Sunrise <span style="font-weight:500;">— Assisted Reader</span></button>
      <button type="button" class="modal-tab" data-level="spark" aria-pressed="false">Genova Spark <span style="font-weight:500;">— Emergent Reader</span></button>
      <button type="button" class="modal-tab" data-level="seeker" aria-pressed="false">Genova Seeker <span style="font-weight:500;">— Developing Reader</span></button>
    </div>
    <div class="modal-body" id="catalogBody"></div>
  </div>
</div>
